<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ABAQUAR · SEPEX 2026{% endblock %}</title>
  <script>
    try {
      const tema = localStorage.getItem('sepex-theme');
      if (tema === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch (_) { /* O tema claro permanece disponível sem armazenamento local. */ }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <a class="marca" href="{{ url_for('web.inicio') }}" aria-label="ABAQUAR — início">
        <span class="marca-logo"><img src="{{ url_for('static', filename='Logo/Logo ABAQUAR.png') }}" alt="Logo da equipe de foguetes ABAQUAR" id="logo-abaquar"></span>
        <span class="marca-texto"><strong>ABAQUAR</strong><small>SEPEX 2026</small></span>
      </a>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="nav-principal" aria-expanded="false" aria-label="Abrir menu"><span></span><span></span><span></span></button>
      <nav class="nav-principal" id="nav-principal" aria-label="Navegação principal">
        <a href="{{ url_for('web.inicio') }}" {% if request.endpoint == 'web.inicio' %}aria-current="page"{% endif %}>Início</a>
        <a href="{{ url_for('web.montagem') }}" {% if request.endpoint == 'web.montagem' %}aria-current="page"{% endif %}>Montagem</a>
        <a href="{{ url_for('web.pagina_ranking') }}" {% if request.endpoint == 'web.pagina_ranking' %}aria-current="page"{% endif %}>Ranking</a>
        <a href="{{ url_for('web.dashboard') }}" {% if request.endpoint == 'web.dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
        <a class="nav-secundaria" href="{{ url_for('web.diagnostico') }}" {% if request.endpoint == 'web.diagnostico' %}aria-current="page"{% endif %}>Diagnóstico</a>
      </nav>
      <button class="tema" id="tema" type="button" aria-label="Alternar tema"><span class="tema-icone" aria-hidden="true">🌙</span><span class="tema-texto">Tema escuro</span></button>
    </div>
  </header>
  <main>{% block conteudo %}{% endblock %}</main>
  <footer>ABAQUAR · SEPEX 2026 <span>Dados de demonstração são sempre identificados.</span></footer>
  <script src="{{ url_for('static', filename='js/base.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
